<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8 题测出你的职场动物人格｜天生适合做什么工作</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23E8A13C'/%3E%3Ccircle cx='38' cy='44' r='7' fill='%2326221B'/%3E%3Ccircle cx='62' cy='44' r='7' fill='%2326221B'/%3E%3Cellipse cx='50' cy='60' rx='9' ry='6' fill='%2326221B'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F6F1E7;
  --card:#FFFDF7;
  --ink:#26221B;
  --ink-soft:#6E675C;
  --line:#E8E0CF;
  /* 四人格主色 */
  --c-cheetah:#E8A13C;
  --c-cheetah-deep:#B97E1F;
  --c-koala:#5E8C88;
  --c-koala-deep:#3F6A66;
  --c-fox:#E2624A;
  --c-fox-deep:#B8442F;
  --c-owl:#5C5FB0;
  --c-owl-deep:#3F3F8C;
  --radius:20px;
  --shadow:0 6px 20px rgba(60,52,38,.10);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.6;
  min-height:100vh;
}
.page{max-width:560px;margin:0 auto;padding:0 18px 56px}

/* ===== 通用组件 ===== */
.badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(232,161,60,.14);color:var(--c-cheetah-deep);
  font-size:12px;font-weight:700;letter-spacing:.5px;
  padding:5px 12px;border-radius:999px;
}
h1.cover-title{
  font-size:30px;line-height:1.35;font-weight:800;letter-spacing:.5px;margin:14px 0 8px;
}
p.cover-sub{color:var(--ink-soft);font-size:15px}

.btn{
  display:block;width:100%;border:none;cursor:pointer;
  font-family:inherit;font-size:17px;font-weight:700;color:#fff;
  background:var(--ink);padding:15px 20px;border-radius:var(--radius);
  transition:transform .12s ease, opacity .2s;
  box-shadow:0 4px 14px rgba(38,34,27,.18);
}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.primary{background:var(--c-cheetah);color:#fff;box-shadow:0 4px 14px rgba(232,161,60,.35)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}

/* ===== 封面 ===== */
.cover{text-align:center;padding:34px 6px 26px}
.cover .animals{display:flex;justify-content:center;gap:10px;margin:26px 0 6px}
.cover .animals .animal{
  width:74px;height:74px;border-radius:50%;
  border:3px solid #fff;box-shadow:var(--shadow);overflow:hidden;
}
.cover .animals img{width:100%;height:100%;object-fit:cover}
.cover .animals .a-cheetah{background:var(--c-cheetah)}
.cover .animals .a-koala{background:var(--c-koala)}
.cover .animals .a-fox{background:var(--c-fox)}
.cover .animals .a-owl{background:var(--c-owl)}
.cover .rules{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:26px 0;
}
.cover .rule{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 8px;
}
.cover .rule .num{font-size:20px;font-weight:800;color:var(--c-cheetah)}
.cover .rule .lab{font-size:12px;color:var(--ink-soft)}
.cover .start-hint{margin-top:18px;color:var(--ink-soft);font-size:13px}
.cover .four{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 4px}
.cover .four span{font-size:12px;font-weight:700;padding:6px 0;border-radius:10px;background:#fff;border:1px solid var(--line)}
.cover .four .f-cheetah{color:var(--c-cheetah-deep)}
.cover .four .f-koala{color:var(--c-koala-deep)}
.cover .four .f-fox{color:var(--c-fox-deep)}
.cover .four .f-owl{color:var(--c-owl-deep)}

/* ===== 答题 ===== */
.quiz-head{position:sticky;top:0;z-index:10;background:var(--bg);padding:18px 0 10px}
.progress-meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.progress-meta .step{font-size:13px;color:var(--ink-soft)}
.progress-meta .step b{font-size:16px;color:var(--ink);font-weight:800}
.progress-track{height:6px;background:#E4DCC9;border-radius:999px;overflow:hidden}
.progress-fill{height:100%;width:0;background:var(--c-cheetah);border-radius:999px;transition:width .35s ease}
.q-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:24px 20px;box-shadow:var(--shadow);
}
.q-num{font-size:13px;font-weight:700;color:var(--c-cheetah-deep);letter-spacing:1px}
.q-text{font-size:19px;font-weight:700;line-height:1.5;margin:12px 0 20px}
.option{
  display:block;width:100%;text-align:left;cursor:pointer;
  background:#fff;border:2px solid var(--line);border-radius:14px;
  padding:14px 16px;margin-bottom:12px;font-family:inherit;font-size:15px;color:var(--ink);
  transition:border-color .15s, background .15s, transform .1s;
}
.option:active{transform:scale(.98)}
.option .key{
  display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;
  background:var(--ink);color:#fff;border-radius:7px;font-size:12px;font-weight:700;margin-right:10px;
}
.option.selected{border-color:var(--c-cheetah);background:rgba(232,161,60,.10)}
.option.selected .key{background:var(--c-cheetah)}
.quiz-foot{margin-top:6px}
.quiz-foot .btn{margin-top:14px}

/* ===== 结果 ===== */
.result{text-align:center}
.result .animal-wrap{
  width:150px;height:150px;margin:26px auto 16px;border-radius:50%;overflow:hidden;
  border:4px solid #fff;box-shadow:var(--shadow);
}
.result .animal-wrap img{width:100%;height:100%;object-fit:cover}
.result .r-tag{font-size:13px;font-weight:700;letter-spacing:1px}
.result .r-name{font-size:32px;font-weight:800;margin:6px 0 4px}
.result .r-slogan{font-size:15px;color:var(--ink-soft);margin:0 0 6px}
.result .r-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0 20px}
.result .r-tags span{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.r-block{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:18px;margin:12px 0;text-align:left;box-shadow:0 2px 10px rgba(60,52,38,.05);
}
.r-block h3{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.r-block h3 .dot{width:9px;height:9px;border-radius:50%;flex:none}
.r-block p{font-size:15px;color:var(--ink-soft)}
.r-block ul{list-style:none}
.r-block li{font-size:15px;color:var(--ink-soft);padding:4px 0 4px 20px;position:relative}
.r-block li::before{content:"";position:absolute;left:2px;top:13px;width:7px;height:7px;border-radius:2px;transform:rotate(45deg)}
.trait li::before{background:var(--accent)}
.fit li::before{background:var(--accent)}
.avoid li::before{background:#C9C2B2}
.tip-box{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:16px;padding:18px;margin:12px 0;text-align:left}
.tip-box h3{font-size:15px;font-weight:800;margin-bottom:8px}
.tip-box p{font-size:15px;color:var(--ink)}

.share-bar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.share-bar .btn{font-size:15px;padding:14px 10px}

/* 结果文案（复制用） */
.copy-toast{
  position:fixed;left:50%;bottom:40px;transform:translate(-50%,20px);
  background:var(--ink);color:#fff;font-size:14px;padding:11px 22px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:50;
}
.copy-toast.show{opacity:1;transform:translate(-50%,0)}

.section-label{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:2px;text-align:center;margin-top:4px}
.hidden{display:none!important}

@media (min-width:768px){
  h1.cover-title{font-size:36px}
  .cover .animals .animal{width:84px;height:84px}
}
</style>
</head>

    tag:"猫头鹰人格", tags:["逻辑控","追求完美","严谨细致"],
    slogan:"你是团队里的质量底线，经你手的活，从来不用担心出低级错误。",

var ORDER = ["cheetah","koala","fox","owl"];
var ACCENT_MAP = {cheetah:["#E8A13C","#B97E1F","rgba(232,161,60,.12)","rgba(232,161,60,.30)"],
  koala:["#5E8C88","#3F6A66","rgba(94,140,136,.12)","rgba(94,140,136,.30)"],
  fox:["#E2624A","#B8442F","rgba(226,98,74,.12)","rgba(226,98,74,.30)"],
  owl:["#5C5FB0","#3F3F8C","rgba(92,95,176,.12)","rgba(92,95,176,.30)"]};

/* ============ 状态 ============ */
var answers = [];   // 每题选的人格 type
var curIndex = 0;
var selectedType = null;

/* ============ 视图切换 ============ */
function show(id){
  ["view-cover","view-quiz","view-result"].forEach(function(v){document.getElementById(v).classList.add("hidden");});
  document.getElementById(id).classList.remove("hidden");
}

/* ============ 封面 ============ */
document.getElementById("startBtn").addEventListener("click", function(){
  answers=[]; curIndex=0; renderQuiz();
  show("view-quiz");
});

/* ============ 答题 ============ */
function renderQuiz(){
  var q = QUESTIONS[curIndex];
  document.getElementById("qIndex").textContent = curIndex+1;
  document.getElementById("qTheme").textContent = q.theme;
  document.getElementById("progressFill").style.width = ((curIndex)/QUESTIONS.length*100)+"%";
  document.getElementById("qNum").textContent = "Q"+(curIndex+1);
  document.getElementById("qText").textContent = q.text;

  var box = document.getElementById("qOptions");
  box.innerHTML = "";
  q.options.forEach(function(opt){
    var b = document.createElement("button");
    b.className = "option";
    b.innerHTML = '<span class="key">'+opt.key+'</span><span>'+opt.text+'</span>';
    b.addEventListener("click", function(){ choose(opt.type, b); });
    box.appendChild(b);
  });

  // 是否已选过
  if(answers[curIndex]){
    selectedType = answers[curIndex];
    markSelected();
  } else {
    selectedType = null;
  }
  updateButtons();
}

function choose(type, btn){
  selectedType = type;
  markSelected();
  updateButtons();
}
function markSelected(){
  var opts = document.querySelectorAll("#qOptions .option");
  opts.forEach(function(el){
    var key = el.querySelector(".key").textContent;
    var q = QUESTIONS[curIndex];
    var t = q.options.filter(function(o){return o.key===key;})[0].type;
    el.classList.toggle("selected", t===selectedType);
  });
}
function updateButtons(){
  document.getElementById("nextBtn").classList.toggle("hidden", curIndex>=QUESTIONS.length-1 || !selectedType);
  document.getElementById("submitBtn").classList.toggle("hidden", !(curIndex===QUESTIONS.length-1 && selectedType));
  document.getElementById("prevBtn").classList.toggle("hidden", curIndex===0);
}

document.getElementById("nextBtn").addEventListener("click", function(){
  if(!selectedType) return;
  answers[curIndex] = selectedType;
  curIndex++;
  renderQuiz();
});
document.getElementById("submitBtn").addEventListener("click", function(){
  if(!selectedType) return;
  answers[curIndex] = selectedType;
  var winner = computeWinner();
  showResult(winner);
});
document.getElementById("prevBtn").addEventListener("click", function(){
  if(curIndex>0) curIndex--;
  renderQuiz();
});

/* ============ 计分 ============ */
function computeWinner(){
  var score = {cheetah:0, koala:0, fox:0, owl:0};
  answers.forEach(function(t){ if(score[t]!==undefined) score[t]++; });
  var max = Math.max(score.cheetah, score.koala, score.fox, score.owl);
  for(var i=0;i<ORDER.length;i++){ if(score[ORDER[i]]===max) return ORDER[i]; }
  return "cheetah";
}

/* ============ 结果 ============ */
function showResult(type){
  var r = RESULT[type];
  var acc = ACCENT_MAP[type];
  document.documentElement.style.setProperty("--accent", acc[0]);
  document.documentElement.style.setProperty("--accent-deep", acc[1]);
  document.documentElement.style.setProperty("--accent-soft", acc[2]);
  document.documentElement.style.setProperty("--accent-line", acc[3]);

  document.getElementById("rAnimalImg").src = r.img;
  document.getElementById("rTag").textContent = r.tag;
  document.getElementById("rTag").style.color = acc[1];
  document.getElementById("rName").textContent = r.name;
  document.getElementById("rSlogan").textContent = r.slogan;

  document.getElementById("dotTrait").style.background = acc[0];
  document.getElementById("dotFit").style.background = acc[0];
  document.getElementById("dotAvoid").style.background = "#C9C2B2";
  document.getElementById("rTrait").textContent = r.trait;

  var fit = document.getElementById("rFit"); fit.innerHTML="";
  r.fit.forEach(function(s){ var li=document.createElement("li"); li.textContent=s; fit.appendChild(li); });
  var av = document.getElementById("rAvoid"); av.innerHTML="";
  r.avoid.forEach(function(s){ var li=document.createElement("li"); li.textContent=s; av.appendChild(li); });

  document.getElementById("rTip").textContent = r.tip;

  var tags = document.getElementById("rTags"); tags.innerHTML="";
  r.tags.forEach(function(s){ var span=document.createElement("span"); span.textContent=s; tags.appendChild(span); });

  window.scrollTo(0,0);
  show("view-result");
}

/* ============ 复制文案 ============ */
document.getElementById("copyBtn").addEventListener("click", function(){
  var type = computeWinner(); var r = RESULT[type];
  var fitTxt = r.fit.join("、");
  var avoidTxt = r.avoid.join("、");
  var text = "我测出是「"+r.name+"」！"
    + "\n"+r.slogan
    + "\n\n核心特质："+r.trait
    + "\n最适配岗位："+fitTxt
    + "\n尽量避雷："+avoidTxt
    + "\n职场建议："+r.tip
    + "\n\n你也来测测你的职场动物人格吧 →";
  copyText(text);
});

function copyText(text){
  var done = function(){
    var t = document.getElementById("toast");
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 2200);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text, done); });
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done){
  var ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  done();
}

/* ============ 重测 ============ */
document.getElementById("retryBtn").addEventListener("click", function(){
  answers=[]; curIndex=0; selectedType=null; renderQuiz(); show("view-quiz");
});
</script>
